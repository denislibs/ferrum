# Стенд тестов поверх docker-compose.yml, свой проект и порты, данные не сохраняются:
# docker compose -p ferrum-test --env-file docker-compose.test.env -f docker-compose.yml -f docker-compose.test.yml up -d --wait
services:
  server:
    ports: !override
      - '127.0.0.1:18090:8090'
    volumes: !override []
    tmpfs:
      - /data:uid=1000,gid=1000
    restart: 'no'

  postgres:
    ports:
      - '127.0.0.1:15432:5432'
    volumes: !override []
    tmpfs:
      - /var/lib/postgresql
    # Тесты много раз пересоздают схему: журнал базы иначе заполняет tmpfs (код 53100).
    command: [postgres, -c, max_wal_size=128MB, -c, min_wal_size=32MB, -c, checkpoint_timeout=30s]
    restart: 'no'

  valkey:
    ports:
      - '127.0.0.1:16379:6379'
    command: [valkey-server, --save, '']
    volumes: !override []
    restart: 'no'

  mailpit:
    ports: !override
      - '127.0.0.1:18025:8025'
      - '127.0.0.1:11025:1025'
    restart: 'no'
