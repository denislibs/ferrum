[workspace]
resolver = "2"
members = [
    "crates/ferrum-doc",
    "crates/ferrum-scene",
    "crates/ferrum-render",
    "crates/ferrum-editor",
    "crates/ferrum-wasm",
    "crates/ferrum-fontmeta",
    "crates/ferrum-text",
]
# Десктоп — свой workspace со своим Cargo.lock (Tauri и сотни крейтов окна).
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
rust-version = "1.96"
license = "UNLICENSED"

[workspace.dependencies]
loro = "=1.16.2"
# loro 1.16.2 не собирается с loro-internal 1.17.x — фиксируем совместимую версию
loro-internal = "=1.16.2"
thiserror = "2.0.20"
blake3 = "1.8"
criterion = "0.8"
proptest = "1.12"
kurbo = "=0.13.1"
# 0.13.0 не годится: после bulk_load вставка падает с «This is a bug in rstar»
# (листья на разной глубине, georust/rstar#254 ещё не выпущен).
rstar = "=0.12.2"
# Булевы операции (спека подсистемы 3, раздел 10): по замеру прототипа этапа 4
# быстрее `linesweeper` на перекрытиях (1000 кругов — ~20 мс против 70–90 мс), на
# касаниях и общих рёбрах — то же. Без `allow_multithreading` (rayon в wasm нет).
i_overlay = { version = "=9.1.0", default-features = false }
# Рендер: vello_cpu сейчас, vello_gpu (бывший vello_hybrid) — на этапе 4. Без
# текстовых возможностей vello: глифы рисуются контурами из skrifa (см. text.rs).
vello_cpu = { version = "=0.3.0", default-features = false, features = ["std", "png", "u8_pipeline"] }
vello_gpu = { version = "=0.3.0", default-features = false, features = ["std", "wgpu"] }
# Атлас изображений vello_gpu: зеркальный кэш выделений (см. ferrum-render/src/gpu.rs).
# Та же версия, что тянут vello_cpu и vello_gpu.
vello_common = { version = "=0.3.0", default-features = false, features = ["std"] }
# Без системных шрифтов: подписи только встроенным Onest, одинаково везде.
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
# Та же версия, что тянет parley 0.12: контуры глифов для подписей.
skrifa = "=0.44.0"
# Редактор: таблица команд, раскладка клавиш и пресеты фреймов в JSON. Те же версии,
# что уже есть в Cargo.lock (их тянут criterion и loro).
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.152"
# Worker и обмен данными (этап 4). Версии wasm-bindgen, js-sys, web-sys и wgpu — те,
# что уже в Cargo.lock (их тянут vello_gpu и wgpu); все опубликованы до 2026-10-10.
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"
js-sys = "=0.3.106"
web-sys = "=0.3.106"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl", "webgpu"] }
# Типы TypeScript для serde-wasm-bindgen (фича `js`, без serde_json внутри tsify).
tsify = { version = "=0.5.8", default-features = false, features = ["js"] }
serde-wasm-bindgen = "=0.6.5"
serde_bytes = "=0.11.19"
console_error_panic_hook = "=0.1.7"
wasm-bindgen-test = "=0.3.79"
# Экспорт PDF (спека подсистемы 3, раздел 11): векторные страницы, подмножества
# шрифтов, картинки. 0.8.2 — последняя (2026-06-04), MIT OR Apache-2.0, Rust 1.92,
# собирается под wasm32 без фич по умолчанию: `raster-images` нужен для картинок
# (png той же версии, что у vello_cpu), `simple-text` (rustybuzz) не нужен — глифы
# раскладывает parley. Тянет свой skrifa 0.42 (у нас 0.44) — цена версии.
krilla = { version = "=0.8.2", default-features = false, features = ["raster-images"] }
# Проверка экспорта SVG в тестах: файл разбирается как XML (только dev-зависимость).
roxmltree = "=0.21.1"
# Проверка экспорта PDF в тестах: потоки PDF сжаты Deflate (та же версия, что тянет krilla).
flate2 = "=1.1.10"
